services:
  postgres:
    image: postgres:16-alpine
    container_name: deallens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deallens
      POSTGRES_PASSWORD: deallens_dev_password
      POSTGRES_DB: deallens
    ports:
      - "5432:5432"
    volumes:
      - deallens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deallens -d deallens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deallens_postgres_data:
